<title>GoldHunter — 4-player gold rush brawler</title>
<style>
:root {
  --gold: #ffc939;
  --ink: #070911;
  --panel: rgba(14, 18, 28, 0.94);
  --line: rgba(140, 156, 196, 0.22);
  --text: #e8ecf7;
  --dim: #98a3c0;
  --font: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #070911;
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  overscroll-behavior: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow: auto;
  background: radial-gradient(ellipse at 50% 0%, rgba(255, 201, 57, 0.07), transparent 60%),
              rgba(5, 7, 13, 0.72);
  backdrop-filter: blur(3px);
  z-index: 5;
}
.overlay.show { display: flex; }

.panel {
  width: min(1080px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px 26px 18px;
  box-shadow: 0 26px 70px rgba(0, 0, 0, 0.62);
}

.panel header { text-align: center; margin-bottom: 14px; }

h1 {
  margin: 0;
  font-size: clamp(34px, 6vw, 58px);
  letter-spacing: 3px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
}
h1 span { color: var(--text); }

.tagline { margin: 6px 0 0; color: var(--dim); font-size: 14px; }

/* ---------------------------------------------------------------- lobby */

.slots {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 16px 0;
}
@media (max-width: 780px) { .slots { grid-template-columns: repeat(2, 1fr); } }

.slot {
  border: 1px solid var(--line);
  border-top: 3px solid var(--c);
  border-radius: 12px;
  padding: 10px 11px 12px;
  background: rgba(255, 255, 255, 0.028);
  transition: background 0.15s ease;
}
.slot.cpu { background: rgba(255, 255, 255, 0.012); }

.slot-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.slot-head b { font-size: 15px; letter-spacing: 1px; }
.chip { width: 13px; height: 13px; border-radius: 4px; background: var(--c); }
.corner { margin-left: auto; font-size: 10px; color: var(--dim); letter-spacing: 0.4px; }

.toggle { display: flex; gap: 4px; margin-bottom: 9px; }
.toggle button {
  flex: 1;
  padding: 6px 0;
  font: 800 11px/1 var(--font);
  letter-spacing: 1px;
  color: var(--dim);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid transparent;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.12s ease;
}
.toggle button:hover { color: var(--text); background: rgba(255, 255, 255, 0.1); }
.toggle button.on {
  color: var(--ink);
  background: var(--c);
  border-color: var(--c);
}

select {
  width: 100%;
  padding: 6px 7px;
  font: 700 12px var(--font);
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  border-radius: 7px;
  cursor: pointer;
}
select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
option { background: #131824; }

.cfg small.hint {
  display: block;
  margin-top: 6px;
  font-size: 10.5px;
  color: var(--dim);
  line-height: 1.35;
  min-height: 26px;
}

.row.options {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  margin: 4px 0 16px;
}
.row.options label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 7px; }
.row.options label select { width: auto; }
label.check { cursor: pointer; }
label.check input { accent-color: var(--gold); }

button.start {
  padding: 12px 26px;
  font: 900 15px/1 var(--font);
  letter-spacing: 2px;
  color: #2a1e02;
  background: linear-gradient(180deg, #ffd75f, #f0a90f);
  border: 0;
  border-radius: 11px;
  cursor: pointer;
  box-shadow: 0 5px 0 #9a6c05, 0 12px 26px rgba(255, 180, 40, 0.22);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
button.start:hover { transform: translateY(-1px); box-shadow: 0 6px 0 #9a6c05, 0 14px 30px rgba(255, 180, 40, 0.3); }
button.start:active { transform: translateY(3px); box-shadow: 0 2px 0 #9a6c05; }

button.ghost {
  padding: 11px 20px;
  font: 800 13px/1 var(--font);
  letter-spacing: 1.5px;
  color: var(--dim);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 11px;
  cursor: pointer;
}
button.ghost:hover { color: var(--text); border-color: var(--gold); }

kbd {
  display: inline-block;
  margin-left: 7px;
  padding: 2px 6px;
  font: 700 10px var(--font);
  color: inherit;
  background: rgba(0, 0, 0, 0.22);
  border-radius: 5px;
  opacity: 0.75;
}

.rules {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 26px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
@media (max-width: 700px) { .rules { grid-template-columns: 1fr; } }
.rules h3 {
  margin: 0 0 6px;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
}
.rules ul { margin: 0; padding-left: 16px; }
.rules li { font-size: 12.5px; color: var(--dim); line-height: 1.6; }
.rules b { color: var(--text); }

.panel footer {
  margin-top: 14px;
  text-align: center;
  font-size: 11px;
  color: rgba(150, 162, 195, 0.7);
}

/* -------------------------------------------------------------- results */

.results table { width: 100%; border-collapse: collapse; margin: 6px 0 18px; }
.results th {
  padding: 7px 8px;
  font-size: 10px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--dim);
  text-align: left;
  border-bottom: 1px solid var(--line);
}
.results td {
  padding: 9px 8px;
  font-size: 13.5px;
  border-bottom: 1px solid rgba(140, 156, 196, 0.1);
}
.results td.n, .results th.n { text-align: right; font-variant-numeric: tabular-nums; }
.results td.strong { font-weight: 900; color: var(--gold); }
.results tr.first td { background: rgba(255, 201, 57, 0.08); }
.results .place {
  display: inline-block;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  font-weight: 900;
  font-size: 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
}
.results tr.first .place { background: var(--gold); color: #2a1e02; }
.results .dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 7px;
  vertical-align: middle;
}
.results td small { color: var(--dim); font-size: 10.5px; margin-left: 7px; }
.results .winner { font-size: clamp(28px, 5vw, 46px); }

</style>

/**
 * The "juice" layer: particles, floating numbers, shockwave rings, screen
 * shake and hit-stop.
 *
 * Hit-stop works by freezing the simulation clock (`Fx.freeze`) while the
 * presentation layer keeps running on real time, so impacts read as a sharp
 * pause instead of a dropped frame.
 */

const { clamp, TAU, easeOutCubic, makeRng } = __require("src/core/math.js");

const rng = makeRng(0xc0ffee);

class Fx {
  constructor() {
    this.particles = [];
    this.texts = [];
    this.rings = [];
    this.trauma = 0;         // 0..1, screen shake energy
    this.freeze = 0;         // remaining hit-stop in real seconds
    this.flash = 0;          // white flash intensity
    this.shakeX = 0;
    this.shakeY = 0;
    this.shakeRot = 0;
    this.time = 0;
    this.zoomKick = 0;
  }

  clear() {
    this.particles.length = 0;
    this.texts.length = 0;
    this.rings.length = 0;
    this.trauma = this.freeze = this.flash = this.zoomKick = 0;
  }

  hitstop(seconds) {
    this.freeze = Math.max(this.freeze, seconds);
  }

  shake(amount) {
    this.trauma = clamp(this.trauma + amount, 0, 1);
  }

  kick(amount) {
    this.zoomKick = Math.max(this.zoomKick, amount);
  }

  whiteFlash(a = 0.5) {
    this.flash = Math.max(this.flash, a);
  }

  /**
   * Cone / radial particle burst.
   * `dir` + `spread` shape a cone; omit `dir` for a full circle.

    size = [0.08, 0.22], dir = null, spread = TAU, drag = 4.5, gravity = 0,

        life: rng.range(life[0], life[1]), maxLife: 0, r: rng.range(size[0], size[1]),
        color, drag, gravity, shape, glow,
        rot: rng.angle(), spin: spin || rng.range(-9, 9),

  ring(x, y, { r0 = 0.4, r1 = 3, life = 0.32, color = '#fff', width = 0.28, fade = true } = {}) {
    this.rings.push({ x, y, r0, r1, life, maxLife: life, color, width, fade });

  text(x, y, str, { color = '#fff', size = 1.0, life = 0.9, vy = -2.4, outline = '#0b0d14', bold = true } = {}) {
    this.texts.push({ x, y, str, color, size, life, maxLife: life, vy, outline, bold });

  /** Advance presentation-only state. Always fed *real* dt. */
  update(dt) {

      p.life -= dt;

      const d = Math.exp(-p.drag * dt);
      p.vx *= d;
      p.vy *= d;
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;

      const t = this.texts[i];
      t.life -= dt;
      if (t.life <= 0) { this.texts.splice(i, 1); continue; }
      t.y += t.vy * dt;
      t.vy *= Math.exp(-2.6 * dt);

    for (let i = this.rings.length - 1; i >= 0; i--) {

      r.life -= dt;

__defs["src/game/items.js"] = function (__exports, __require) {
/** Shop catalogue helpers: pricing, availability and purchase application. */

const { ITEMS } = __require("src/config.js");

const ITEM_BY_ID = Object.fromEntries(ITEMS.map((i) => [i.id, i]));

/** Current level of an item for a player (scaleUp/scaleDown share one axis). */
function levelOf(player, id) {
  if (id === 'scaleUp') return Math.max(0, player.scaleLevel);
  if (id === 'scaleDown') return Math.max(0, -player.scaleLevel);
  return player.upgrades[id] || 0;
}

function priceOf(player, id) {
  const def = ITEM_BY_ID[id];
  return def.cost(levelOf(player, id));
}

function isMaxed(player, id) {
  const def = ITEM_BY_ID[id];
  return levelOf(player, id) >= def.max;
}

/**
 * Spendable gold: what you are carrying plus what is in your vault.
 *
 * Charging the bag alone was tried first and it warps the whole game — the bag
 * size becomes a hard price ceiling, so anything expensive (Steal above all)
 * can only be bought by standing around with a fat unbanked bag, which is
 * exactly what rivals punch out of you. Letting the vault pay keeps every
 * upgrade reachable and makes the cost honest: it comes straight off your
 * final score.
 */
function funds(player) {
  return player.bag + (player.home ? player.home.vault : 0);
}

/** Can this player afford + legally buy the item right now? */
function canBuy(player, id) {
  if (isMaxed(player, id)) return false;
  return funds(player) >= priceOf(player, id);
}

/**
 * Applies a purchase. Returns the price paid, or 0 when the buy was rejected.
 * Carried gold is spent first, then the vault covers the remainder.
 */
function buy(player, id) {
  if (!canBuy(player, id)) return 0;
  const price = priceOf(player, id);
  const fromBag = Math.min(player.bag, price);
  player.bag -= fromBag;
  const fromVault = price - fromBag;
  if (fromVault > 0) player.home.vault -= fromVault;
  player.spent += price;
  player.spentFromVault = (player.spentFromVault || 0) + fromVault;

  switch (id) {
    case 'scaleUp':
      player.scaleLevel = Math.min(ITEM_BY_ID.scaleUp.max, player.scaleLevel + 1);
      break;
    case 'scaleDown':
      player.scaleLevel = Math.max(-ITEM_BY_ID.scaleDown.max, player.scaleLevel - 1);
      break;
    case 'steal':
      player.upgrades.steal = 1;
      player.canSteal = true;
      break;
    default:
      player.upgrades[id] = (player.upgrades[id] || 0) + 1;
      break;
  }
  player.purchases.push(id);
  return price;
}

/** Ordered list for the shop UI, with per-player state baked in. */
function shopRows(player) {
  return ITEMS.map((def) => ({
    def,
    id: def.id,
    level: levelOf(player, def.id),
    price: priceOf(player, def.id),
    maxed: isMaxed(player, def.id),
    affordable: canBuy(player, def.id),
    needsVault: player.bag < priceOf(player, def.id),
  }));
}

__exports.__set({ ITEM_BY_ID, levelOf, priceOf, isMaxed, funds, canBuy, buy, shopRows });

};

/**

const { MATCH, COLORS, ITEMS } = __require("src/config.js");

    const rush = world.rushing;

    const bw = 168, bh = 54;
    const x = w / 2 - bw / 2;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x, 10, bw, bh, 12);
    ctx.fillStyle = 'rgba(10,13,21,0.82)';
    ctx.fill();
    ctx.strokeStyle = rush ? '#ff7a3c' : 'rgba(140,155,195,0.35)';
    ctx.lineWidth = rush ? 2.5 + Math.sin(this.pulse * 9) * 1.2 : 1.5;
    ctx.stroke();

    label(ctx, txt, w / 2, 34, {
      size: rush ? 34 : 31, weight: 900,
      color: rush ? '#ff9a5c' : left < 30 ? '#ffd23f' : '#eef2ff',
    });
    label(ctx, rush ? 'GOLD RUSH' : 'TIME LEFT', w / 2, 55, {
      size: 10, weight: 800, color: rush ? '#ffb37a' : 'rgba(180,192,220,0.75)',
    });

    // Match progress bar
    const p = clamp(1 - left / MATCH.duration, 0, 1);
    ctx.beginPath();
    ctx.roundRect(x + 10, 10 + bh - 6, bw - 20, 3, 2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.beginPath();

      ctx.arc(rx, y + 41, 13, 0, TAU);
      ctx.fillStyle = rank === 1 ? COLORS.gold : 'rgba(255,255,255,0.09)';
      ctx.fill();
      label(ctx, `${rank}`, rx, y + 42, {
        size: 14, weight: 900, color: rank === 1 ? '#241a05' : '#dbe2f5',
      });

      // Bag bar
      const by = y + 58;
      ctx.beginPath();
      ctx.roundRect(x + 10, by, cw - 20, 9, 4);
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x + 10, by, (cw - 20) * p.bagFill, 9, 4);
      ctx.fillStyle = p.bagFill > 0.95 ? '#fff2b0' : COLORS.gold;
      ctx.fill();
      label(ctx, `${Math.floor(p.bag)}/${p.bagCap}`, x + cw / 2, by + 5, {
        size: 9, weight: 800, color: p.bagFill > 0.5 ? '#3a2c05' : 'rgba(230,236,250,0.85)', outline: null,

  _ticker(ctx, world, w, h) {

      const cx = Math.cos(a) * 13.5;
      const cy = Math.sin(a) * 13.5;
      const px = -Math.sin(a);
      const py = Math.cos(a);
      this.rocks.push(new Rock(cx + px * 4.4, cy + py * 4.4, 1.6, 200 + i * 2));
      this.rocks.push(new Rock(cx - px * 4.4, cy - py * 4.4, 1.6, 201 + i * 2));
    }
    // Outer cover behind the shops and small poppers.
    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI) / 2;
      this.rocks.push(new Rock(Math.cos(a) * 28, Math.sin(a) * 28, 2.3, 300 + i));
    }

    // Static blockers for both physics and navigation.
    this.blockers = [
      ...this.rocks.map((r) => ({ x: r.x, y: r.y, r: r.radius, kind: 'rock', ref: r })),
      ...this.poppers.map((p) => ({ x: p.x, y: p.y, r: p.radius, kind: 'popper', ref: p })),
      ...this.shops.map((s) => ({ x: s.x, y: s.y, r: s.radius, kind: 'shop', ref: s })),
    ];
    this.nav = new NavGrid({ half: ARENA.half, cornerCut: ARENA.cornerCut }, this.blockers);

    this.pickups = [];
  }

  _buildPlayers() {
    this.players = [];
    const slots = this.setup.slots;
    for (let i = 0; i < 4; i++) {
      const slot = slots[i];
      const camp = this.camps[i];
      const a = this.campAngles[i];
      const p = new Player(i, {
        name: slot.name,
        isHuman: slot.type === 'human',
        controller: slot.controller,
        home: camp,
        x: camp.x - Math.cos(a) * 1.6,
        y: camp.y - Math.sin(a) * 1.6,
        facing: a + Math.PI,
      });
      if (slot.type === 'cpu') {
        const profile = slot.profile || NPC_PROFILES[i % NPC_PROFILES.length];
        p.profile = profile;
        p.brain = new NpcBrain(p, profile, this.diff, this.nav, 1234 + i * 77);
      }
      this.players.push(p);
    }
  }

  /* -------------------------------------------------------------- helpers */

  get timeLeft() { return Math.max(0, MATCH.duration - this.time); }
  get rushing() { return this.state === 'playing' && this.timeLeft <= MATCH.rushAt; }

  get leaderIndex() {
    let best = 0;
    for (let i = 1; i < 4; i++) if (this.camps[i].vault > this.camps[best].vault) best = i;
    return best;
  }

  playersNear(x, y, r, exclude = null) {
    return this.players.filter((p) => p !== exclude && p.alive && dist(p.x, p.y, x, y) <= r);
  }

  announce(text, color = COLORS.text, life = 1.6) {
    this.banner = { text, color, life, maxLife: life };
  }

  logEvent(text, color) {
    this.events.push({ text, color, life: 3.4 });
    if (this.events.length > 5) this.events.shift();
  }

  /* --------------------------------------------------------------- update */

  /** @param {number} realDt seconds of wall-clock time since the last frame */
  update(realDt) {
    const dt = this.fx.simDt(realDt);
    this.fx.update(realDt);

    if (this.banner) {
      this.banner.life -= realDt;
      if (this.banner.life <= 0) this.banner = null;
    }
    for (let i = this.events.length - 1; i >= 0; i--) {
      this.events[i].life -= realDt;
      if (this.events[i].life <= 0) this.events.splice(i, 1);
    }

    if (this.state === 'countdown') {
      const prev = Math.ceil(this.countdown);
      this.countdown -= realDt;
      const now = Math.ceil(this.countdown);
      if (now !== prev) {
        if (now > 0) { this.announce(String(now), COLORS.text, 0.9); this.sfx.beep(false); }
      }
      if (this.countdown <= 0) {
        this.state = 'playing';
        this.announce('GO!', COLORS.gold, 1.0);
        this.sfx.beep(true);
      }
      // Poppers still tick during the countdown so the opening rush matters.
      for (const p of this.poppers) p.update(dt, this, 0);
      for (const c of this.camps) c.update(dt);
      return;
    }

    if (this.state === 'ended') {
      for (const p of this.poppers) p.update(dt, this, 0);
      for (const c of this.camps) c.update(dt);
      for (const g of this.pickups) g.update(dt, []);
      return;
    }

    this.time += dt;
    if (!this.rushStarted && this.rushing) {
      this.rushStarted = true;
      this.bigPopper.gold = Math.min(this.bigPopper.cap, this.bigPopper.gold + MATCH.rushBurst);
      this.bigPopper.addShake(1.2);
      this.fx.shake(0.6);
      this.announce('GOLD RUSH!', COLORS.gold, 2.0);
      this.logEvent('Poppers overflowing — final 25 seconds!', COLORS.gold);
      this.sfx.rush();
    }
    if (this.time >= MATCH.duration) { this._finish(); return; }

    const rateMul = this.rushing ? MATCH.rushPopperMultiplier : 1;
    for (const pop of this.poppers) pop.update(dt, this, rateMul);
    for (const camp of this.camps) camp.update(dt);
    for (const shop of this.shops) { shop.update(dt); shop.customers.clear(); }

    // --- brains write into their virtual controllers before the sim step ---
    for (const p of this.players) if (p.brain) p.brain.update(dt, this);

    for (const p of this.players) p.update(dt, this);

    this._resolveCollisions(dt);
    this._resolveInteractions(dt);
    this._resolvePunches(dt);
    this._updatePickups(dt);
  }

  _finish() {
    this.state = 'ended';
    this.time = MATCH.duration;
    this.sfx.chargeStop();
    this.sfx.fanfare();
    this.fx.shake(0.5);

    const rows = this.players.map((p, i) => {
      const vault = this.camps[i].vault;
      const bonus = vault * p.endBonusRate;
      return {
        index: i,
        name: p.name,
        isHuman: p.isHuman,
        profile: p.profile || null,
        color: p.color,
        vault,
        bonus,
        total: vault + bonus,
        carried: p.bag,
        stats: p.stats,
        upgrades: { ...p.upgrades },
        scaleLevel: p.scaleLevel,
      };
    });
    rows.sort((a, b) => b.total - a.total);
    rows.forEach((r, i) => { r.place = i + 1; });
    this.results = rows;
    this.announce(`${rows[0].name} WINS`, rows[0].color, 3);

    for (const c of this.camps) { c.shake = 0.7; c.flash = 1; }
    for (let i = 0; i < 40; i++) {
      const a = this.rng.angle();
      const r = this.rng.range(0, 12);
      this.fx.burst(Math.cos(a) * r, Math.sin(a) * r, {
        count: 2, color: COLORS.gold, speed: [3, 10], life: [0.6, 1.4],
        size: [0.12, 0.26], gravity: 9, drag: 1.1, shape: 'coin',
      });
    }
  }

  /* ---------------------------------------------------------- collisions */

  _resolveCollisions(dt) {
    // Players vs static blockers.
    for (const p of this.players) {
      for (const b of this.blockers) {
        const push = circlePush(p.x, p.y, p.radius, b.x, b.y, b.r);
        if (push) {
          p.x += push[0];
          p.y += push[1];
          const nl = Math.hypot(push[0], push[1]) || 1;
          const nx = push[0] / nl, ny = push[1] / nl;
          const vn = p.vx * nx + p.vy * ny;
          if (vn < 0) {
            p.vx -= vn * nx * (1 + ARENA.wallBounce);
            p.vy -= vn * ny * (1 + ARENA.wallBounce);
          }
          if (b.kind === 'popper' && p.dashTimer > 0) b.ref.addShake(0.25);
        }
      }
      this._clampToArena(p);
    }

    // Players vs players (soft, mass scales with size).
    for (let i = 0; i < this.players.length; i++) {
      for (let j = i + 1; j < this.players.length; j++) {
        const a = this.players[i], b = this.players[j];
        const push = circlePush(a.x, a.y, a.radius, b.x, b.y, b.radius);
        if (!push) continue;
        const ma = a.scale, mb = b.scale;
        const ta = mb / (ma + mb), tb = ma / (ma + mb);
        a.x += push[0] * ta; a.y += push[1] * ta;
        b.x -= push[0] * tb; b.y -= push[1] * tb;
      }
    }
    for (const p of this.players) this._clampToArena(p);
  }

  _clampToArena(p) {
    const lim = ARENA.half - p.radius;
    if (p.x < -lim) { p.x = -lim; p.vx = Math.abs(p.vx) * ARENA.wallBounce; }
    if (p.x > lim) { p.x = lim; p.vx = -Math.abs(p.vx) * ARENA.wallBounce; }
    if (p.y < -lim) { p.y = -lim; p.vy = Math.abs(p.vy) * ARENA.wallBounce; }
    if (p.y > lim) { p.y = lim; p.vy = -Math.abs(p.vy) * ARENA.wallBounce; }

    // Chamfered corners: |x| + |y| <= D.
    const D = ARENA.half * 2 - ARENA.cornerCut - p.radius * Math.SQRT2;
    const s = Math.abs(p.x) + Math.abs(p.y);
    if (s > D) {
      const over = (s - D) / 2;
      const sx = sign(p.x) || 1;
      const sy = sign(p.y) || 1;
      p.x -= sx * over;
      p.y -= sy * over;
      const vn = p.vx * sx * DIAG + p.vy * sy * DIAG;
      if (vn > 0) {
        p.vx -= vn * sx * DIAG * (1 + ARENA.wallBounce);
        p.vy -= vn * sy * DIAG * (1 + ARENA.wallBounce);
      }
    }
  }

  /* ------------------------------------------- harvest / bank / shop zones */

  _resolveInteractions(dt) {
    for (const p of this.players) {
      if (!p.alive) continue;

      // --- coin poppers ---
      for (const pop of this.poppers) {
        if (dist(p.x, p.y, pop.x, pop.y) <= pop.reach + p.radius) {
          pop.harvest(p, dt, this);
        }
      }

      // --- own base camp: deposit ---
      const home = p.home;
      if (p.bag > 0 && dist(p.x, p.y, home.x, home.y) <= home.radius + p.radius * 0.5) {
        const moved = Math.min(p.bag, p.depositRate * dt);
        p.bag -= moved;
        home.vault += moved;
        p.stats.banked += moved;
        p.depositing = 1;
        home.depositGlow = 1;
        home.shake = Math.min(0.5, home.shake + dt * 1.4);
        p._depositTick = (p._depositTick || 0) + moved;
        if (p._depositTick > 14) {
          p._depositTick = 0;
          if (p.isHuman) this.sfx.deposit();
          this.fx.burst(p.x, p.y, {
            count: 3, color: COLORS.gold, speed: [2, 5], life: [0.25, 0.5],
            size: [0.1, 0.2], shape: 'coin', drag: 3,
          });
          this.fx.ring(home.x, home.y, { r0: home.radius * 0.4, r1: home.radius, life: 0.3, color: home.color, width: 0.16 });
        }
        if (p.bag <= 0.01) {
          p.bag = 0;
          this.fx.ring(home.x, home.y, { r0: 0.5, r1: home.radius * 1.5, life: 0.4, color: COLORS.gold, width: 0.22 });
        }
      }

      // --- shops ---
      let inShop = null;
      for (const s of this.shops) {
        if (dist(p.x, p.y, s.x, s.y) <= SHOP.browseRange + p.radius) { inShop = s; break; }
      }
      if (inShop !== p.shop) {
        p.buyHold = 0;
        p.shop = inShop;
        if (inShop) { inShop.flash = 0.6; if (p.isHuman) this.sfx.pop(); }
      }
      if (inShop) inShop.customers.add(p.index);
    }
  }

  /* ------------------------------------------------------------- punching */

  /** Called by Player when a swing reaches its active frames. */
  registerPunch(p) {
    const o = p.punchOrigin();
    const power = p.punchPower;
    this.fx.ring(o.x, o.y, {
      r0: 0.2, r1: o.range * (0.8 + power * 0.6), life: 0.18 + power * 0.1,
      color: power > 0 ? '#fff0b0' : '#ffffff', width: 0.12 + power * 0.16,
    });
    this.fx.burst(o.x, o.y, {
      count: 4 + Math.round(power * 8), color: power > 0 ? '#ffe08a' : '#cfd8ff',
      speed: [3, 8 + power * 8], life: [0.12, 0.3], size: [0.06, 0.16],
      dir: p.facing, spread: COMBAT.punchArc, drag: 7,
    });
    this.sfx.punch(power);
  }

  _resolvePunches(dt) {
    for (const p of this.players) {
      if (p.phase !== 'active') continue;
      const o = p.punchOrigin();
      const power = p.punchPower;

      // --- players ---
      for (const v of this.players) {
        if (v === p || !v.alive || p.hitSet.has(v)) continue;
        if (v.invuln > 0) continue;
        const d = dist(p.x, p.y, v.x, v.y);
        if (d > p.radius + v.radius + o.range * 0.85) continue;
        const ang = Math.atan2(v.y - p.y, v.x - p.x);
        if (Math.abs(angleDelta(p.facing, ang)) > COMBAT.punchArc * 0.5 + 0.25) continue;
        p.hitSet.add(v);
        this._landHit(p, v, power);
      }

      // --- enemy base camps (requires the Steal upgrade) ---
      if (p.canSteal) {
        for (const camp of this.camps) {
          if (camp.owner === p.index || p.hitSet.has(camp)) continue;
          const d = dist(p.x, p.y, camp.x, camp.y);
          if (d > p.radius + camp.radius + o.range * 0.8) continue;
          p.hitSet.add(camp);
          this._raidCamp(p, camp, power);
        }
      }

      // --- coin poppers: a punch shakes coins loose ---
      for (const pop of this.poppers) {
        if (p.hitSet.has(pop)) continue;
        const d = dist(p.x, p.y, pop.x, pop.y);
        if (d > p.radius + pop.radius + o.range * 0.8) continue;
        p.hitSet.add(pop);
        this._punchPopper(p, pop, power);
      }
    }
  }

  _landHit(attacker, victim, power) {
    const isCharged = power > 0;
    // How much of the victim's bag comes loose.
    let frac = isCharged
      ? lerp(COMBAT.chargedStealMin, COMBAT.chargedStealMax, power)
      : COMBAT.lightSteal;
    frac *= attacker.attackMul * victim.defenseMul;
    frac = clamp(frac, 0.05, 0.95);

    let amount = victim.bag * frac;
    if (victim.bag > 0) amount = Math.max(amount, Math.min(COMBAT.minSteal, victim.bag));
    amount = Math.min(amount, victim.bag);
    amount = Math.round(amount);

    victim.bag -= amount;
    victim.stats.lost += amount;
    victim.stats.punchesTaken++;
    attacker.stats.punchesLanded++;

    const taken = attacker.addGold(Math.round(amount * COMBAT.attackerShare));
    attacker.stats.robbed += taken;
    const dropped = amount - taken;

    const ang = Math.atan2(victim.y - attacker.y, victim.x - attacker.x);
    if (dropped > 0.5) scatterGold(this, victim.x, victim.y, dropped, victim.index, ang);

    const force = (isCharged
      ? lerp(COMBAT.knockbackChargedMin, COMBAT.knockbackChargedMax, power)
      : COMBAT.knockbackLight) * attacker.attackMul;
    victim.takeKnockback(Math.cos(ang), Math.sin(ang), force);
    victim.stun = PLAYER.stunTime + (isCharged ? COMBAT.stunChargedBonus * power : 0);
    victim.invuln = PLAYER.invulnAfterHit;
    victim.hitFlash = 1;
    victim.squash = 1.35;
    victim.charging = false;
    victim.chargeTime = 0;
    victim.phase = 'idle';
    victim.phaseTimer = 0;

    // --- juice ---
    const hs = isCharged
      ? lerp(COMBAT.hitstopChargedMin, COMBAT.hitstopChargedMax, power)
      : COMBAT.hitstopLight;
    this.fx.hitstop(hs);
    this.fx.shake(isCharged ? lerp(COMBAT.shakeLight, COMBAT.shakeCharged, power) : COMBAT.shakeLight);
    this.fx.kick(isCharged ? 0.5 + power * 0.5 : 0.22);
    if (isCharged && power > 0.6) this.fx.whiteFlash(0.18 + power * 0.22);

    const hx = (attacker.x + victim.x) / 2;
    const hy = (attacker.y + victim.y) / 2;
    this.fx.ring(hx, hy, {
      r0: 0.3, r1: 2.4 + power * 3.4, life: 0.26 + power * 0.14,
      color: '#ffffff', width: 0.2 + power * 0.3,
    });
    this.fx.burst(hx, hy, {
      count: 10 + Math.round(power * 18), color: '#fff6d0',
      speed: [5, 12 + power * 16], life: [0.16, 0.42], size: [0.07, 0.2],
      dir: ang, spread: 2.1, drag: 6,
    });
    if (amount > 0) {
      this.fx.burst(victim.x, victim.y, {
        count: Math.min(16, 3 + Math.round(amount / 5)), color: COLORS.gold,
        speed: [3, 9], life: [0.3, 0.7], size: [0.1, 0.2],
        dir: ang, spread: 2.6, gravity: 10, drag: 2, shape: 'coin',
      });
      this.fx.text(victim.x, victim.y - victim.radius - 0.6, `-${amount}`, {
        color: '#ff8b8b', size: 1 + Math.min(0.7, amount / 60), life: 0.9,
      });
      if (taken > 0) {
        this.fx.text(attacker.x, attacker.y - attacker.radius - 0.6, `+${taken}`, {
          color: COLORS.gold, size: 1 + Math.min(0.6, taken / 60), life: 0.9,
        });
      }
    }
    if (isCharged && power > 0.75) {
      this.logEvent(`${attacker.name} SMASHED ${victim.name} for ${amount}g`, attacker.color);
    }
  }

  _raidCamp(thief, camp, power) {
    const cool = thief.lastStolenFrom.get(camp.owner) || 0;
    if (cool > 0) {
      this.fx.text(camp.x, camp.y - camp.radius, `${cool.toFixed(1)}s`, { color: '#9aa6c4', size: 0.85, life: 0.6 });
      this.sfx.deny();
      return;
    }
    const owner = this.players[camp.owner];
    let amount = Math.min(
      Math.max(CAMP.stealMin, camp.vault * CAMP.stealFraction * (1 + power * 0.5) * owner.campArmor),
      CAMP.stealCap,
      camp.vault,
      thief.bagSpace,
    );
    amount = Math.round(amount);
    if (amount <= 0) {
      this.sfx.deny();
      this.fx.text(camp.x, camp.y - camp.radius, camp.vault < 1 ? 'EMPTY' : 'BAG FULL', {
        color: '#9aa6c4', size: 0.9, life: 0.8,
      });
      return;
    }

    camp.vault -= amount;
    thief.bag += amount;
    thief.stats.campRaids++;
    thief.stats.raidedFor += amount;
    owner.stats.lost += amount;
    thief.lastStolenFrom.set(camp.owner, CAMP.stealCooldown);

    camp.shake = 1;
    camp.flash = 1;
    camp.alarm = 1.6;
    this.fx.hitstop(0.07);
    this.fx.shake(0.45);
    this.fx.ring(camp.x, camp.y, { r0: 0.4, r1: camp.radius * 1.8, life: 0.45, color: '#ff5d5d', width: 0.26 });
    this.fx.burst(camp.x, camp.y, {
      count: 18, color: COLORS.gold, speed: [4, 11], life: [0.3, 0.7],
      size: [0.1, 0.22], gravity: 10, drag: 2, shape: 'coin',
    });
    this.fx.text(camp.x, camp.y - camp.radius - 0.4, `STOLEN ${amount}`, { color: '#ff9d5d', size: 1.25, life: 1.1 });
    this.sfx.steal();
    this.sfx.alarm();
    this.logEvent(`${thief.name} raided ${owner.name}'s vault for ${amount}g`, thief.color);
  }

  _punchPopper(p, pop, power) {
    if (pop.gold <= 0) {
      pop.addShake(0.5);
      return;
    }
    const amount = Math.round(Math.min(pop.gold, 5 + power * 11));
    pop.gold -= amount;
    pop.addShake(1.1 + power * 0.3);
    const ang = Math.atan2(pop.y - p.y, pop.x - p.x);
    scatterGold(this, pop.x, pop.y, amount, -1, ang + Math.PI);
    this.fx.hitstop(0.03 + power * 0.03);
    this.fx.shake(0.18 + power * 0.2);
    this.fx.ring(pop.x, pop.y, { r0: pop.radius * 0.5, r1: pop.radius * 2, life: 0.3, color: COLORS.gold, width: 0.2 });
    this.sfx.coin(2);
  }

  /* -------------------------------------------------------------- pickups */

  _updatePickups(dt) {
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const g = this.pickups[i];
      g.update(dt, this.players);
      if (g.dead) { this.pickups.splice(i, 1); continue; }

      for (const p of this.players) {
        if (!p.alive || p.bagSpace <= 0) continue;
        if (g.lock > 0 && p.index === g.owner) continue;
        if (dist(p.x, p.y, g.x, g.y) > p.radius + PICKUP.radius + 0.3) continue;
        const got = p.addGold(g.amount);
        this.fx.text(p.x, p.y - p.radius - 0.5, `+${Math.round(got)}`, {
          color: COLORS.gold, size: 0.85, life: 0.6, vy: -3,
        });
        this.fx.burst(g.x, g.y, {
          count: 4, color: COLORS.gold, speed: [2, 5], life: [0.2, 0.4],
          size: [0.08, 0.16], shape: 'coin', drag: 4,
        });
        if (p.isHuman) this.sfx.coin(1);
        this.pickups.splice(i, 1);
        break;
      }
    }
    // Keep the floor from filling with thousands of blobs.
    if (this.pickups.length > 160) this.pickups.splice(0, this.pickups.length - 160);
  }

  /* ------------------------------------------------------------ purchases */

  tryBuy(player, itemId) {
    const shop = player.shop;
    if (!shop) return false;
    if (isMaxed(player, itemId)) {
      this.sfx.deny();
      this.fx.text(player.x, player.y - player.radius - 0.7, 'MAXED', { color: '#9aa6c4', size: 0.9, life: 0.7 });
      return false;
    }
    if (!canBuy(player, itemId)) {
      this.sfx.deny();
      const need = priceOf(player, itemId) - Math.floor(funds(player));
      this.fx.text(player.x, player.y - player.radius - 0.7, `NEED ${Math.ceil(need)}g`, {
        color: '#ff8b8b', size: 0.9, life: 0.8,
      });
      return false;
    }
    const paid = buy(player, itemId);
    const def = ITEMS.find((i) => i.id === itemId);
    shop.flash = 1;
    this.sfx.buy();
    this.fx.hitstop(0.04);
    this.fx.ring(player.x, player.y, { r0: 0.3, r1: 2.6, life: 0.4, color: player.color, width: 0.2 });
    this.fx.burst(player.x, player.y, {
      count: 16, color: player.color, speed: [3, 9], life: [0.3, 0.6],
      size: [0.08, 0.2], drag: 4, glow: true,
    });
